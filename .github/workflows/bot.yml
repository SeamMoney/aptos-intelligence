name: Aptos Intelligence Bot

on:
  schedule:
    # Refresh data every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch: # Manual trigger

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Install backend deps
      - run: npm ci

      # Install web deps
      - run: cd web && npm ci

      # Refresh commit data + generate reports
      - name: Refresh data from GitHub
        run: node scripts/refresh-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      # Upgrade shallow reports with knowledge base
      - name: Upgrade reports with knowledge base
        run: node scripts/smart-regen.mjs
        continue-on-error: true

      # Build web frontend
      - name: Build web
        run: cd web && npm run build

      # Deploy to Vercel
      - name: Deploy to Vercel
        run: cd web && npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_Volpq5OH75qm2aURtzqMSjEP
          VERCEL_PROJECT_ID: prj_Bw8gHcfPLWWNba3SNadv9yzuppSX

      # Commit updated data back to repo
      - name: Commit data updates
        run: |
          git config user.name "Aptos Intelligence Bot"
          git config user.email "bot@aptos-intelligence.dev"
          git add web/public/data/
          git diff --staged --quiet || git commit -m "chore: auto-refresh data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
